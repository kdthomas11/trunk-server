# Response headers that should be on everything this proxy serves.
#
# Included per-block rather than set once at server level, because nginx's
# add_header only inherits into a block that defines no add_header of its own.
# Several locations here set their own Cache-Control, and those would silently
# drop every header below - the classic way this ends up half-applied.
#
# `always` so they are sent on error responses too, not only 2xx/3xx.
#
# Deliberately not here:
#   Strict-Transport-Security  - only meaningful on the TLS blocks, and it is
#                                set there with includeSubDomains. Sending it
#                                over plain HTTP does nothing.
#   Content-Security-Policy    - needs ${DOMAIN_NAME}, which is substituted into
#                                site.template and not into this file, and it
#                                only belongs on the host that serves HTML.

# Stops a browser second-guessing a declared Content-Type. Without it a file
# served as text/plain can be sniffed and executed as script.
add_header X-Content-Type-Options "nosniff" always;

# Superseded by frame-ancestors in the CSP for modern browsers, kept for the
# ones that never implemented it.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; cross-origin requests see the origin
# alone. Call URLs carry a system short name and a call id, and there is no
# reason for those to reach a third party in a Referer header.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
