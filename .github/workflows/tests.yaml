# Runs the test suites. Until this existed nothing ran them: the only workflow
# in this repo builds and pushes images, so backend/test/spec.js had never
# executed in CI, and neither had anything else.
#
# Deliberately runs on every branch, not just master. A test that only runs
# after merge tells you about a problem you already shipped.
name: Tests

on:
  push:
  pull_request:

jobs:
  # No dependencies and no services - just reads the three model files. Kept as
  # its own job so a drift failure is legible on its own rather than buried in
  # a test log.
  user-schema-drift:
    name: User schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-user-schema-drift.js

  account:
    name: Account server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: account/package-lock.json

      # --omit=dev matches how the runtime image is built. The tests use node's
      # built-in runner and only the production dependencies, so this is both
      # faster than a full install and a check that they have not quietly picked
      # up a devDependency that would not exist in the container.
      - run: npm ci --omit=dev
        working-directory: account

      # Goes through server/test/run.js rather than `node --test` directly. A
      # pattern that matches no files reports "tests 0" and exits 0, so a moved
      # file or a mistyped glob would switch the suite off and leave this job
      # green. run.js fails if fewer than its FLOOR tests actually ran.
      - name: Run the account suite (fails if tests go missing)
        run: npm run test:server
        working-directory: account

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --omit=dev
        working-directory: backend

      # No mongo service and no S3 credentials on purpose: the suite fakes both
      # at the model boundary, so it runs anywhere node does. If that stops being
      # true this job fails, which is the point.
      - name: Run the backend suite (fails if tests go missing)
        run: npm test
        working-directory: backend
